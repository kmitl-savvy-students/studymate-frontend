name: Build & Deploy Frontend to Cloud Run

# on:
#     workflow_dispatch:
#         inputs:
#             branch:
#                 description: 'The branch to trigger the workflow on'
#                 required: true
#                 default: 'main'
#                 type: string

on:
    push:
        branches:
            - gcp-main
    workflow_dispatch:


jobs:
  build-push:
    name: Build, Push Image to Artifact Registry
    runs-on:
        labels: ['self-hosted', 'Linux', 'X64', 'gcp-runner'] 
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Authenticate to Artifact Registry
        run: |
          gcloud auth configure-docker asia-southeast1-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build -f Dockerfile.prod.gcp -t asia-southeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/studymate-frontend-repo/angular-frontend:latest .

      - name: Push to Artifact Registry
        run: |
          docker push asia-southeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/studymate-frontend-repo/angular-frontend:latest

  deploy:
    name: Deploy to Cloud Run
    runs-on:
        labels: ['self-hosted', 'Linux', 'X64', 'gcp-runner'] 
    needs: build-push 
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # - name: Set GCP Project
      #   run: gcloud config set project ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy sdm-angular-frontend \
            --image asia-southeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/studymate-frontend-repo/angular-frontend:latest \
            --region asia-southeast1 \
            --platform managed \
            --allow-unauthenticated \
            --vpc-connector studymate-connector \
            --vpc-egress private-ranges-only \
            --port 80 \
            --service-account ${{ secrets.GCP_RUN_RUNTIME_SA }}
            

        