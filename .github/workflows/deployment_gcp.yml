name: Build & Deploy Frontend to Cloud Run

on:
    workflow_dispatch:
        inputs:
            branch:
                description: 'The branch to trigger the workflow on'
                required: true
                default: 'main'
                type: string

jobs:
  build-push:
    name: Build, Push Image to Artifact Registry
    runs-on:
        labels: ['self-hosted', 'Linux', 'X64', 'gcp-runner'] 
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Authenticate to Artifact Registry
        run: |
          gcloud auth configure-docker asia-southeast1-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build -f Dockerfile.prod.gcp -t asia-southeast1-docker.pkg.dev/studymate-migrate-project/studymate-frontend-repo/angular-frontend:latest .

      - name: Push to Artifact Registry
        run: |
          docker push asia-southeast1-docker.pkg.dev/studymate-migrate-project/studymate-frontend-repo/angular-frontend:latest
 
