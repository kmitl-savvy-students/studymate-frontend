server {
    listen 80; # Cloud Run injects PORT via env, 80 หรือ 8080 ก็ได้ตาม Cloud Run settings
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve Angular app
    location / {
        try_files $uri /index.html;
    }

    # Proxy /api requests to internal backend
    location /api/ {
        # Internal backend IP + port
        proxy_pass http://10.10.2.2:8080;  # **ไม่ต้องมี trailing slash**
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cloud Run expects to respond correctly to HTTPS from client
        proxy_redirect off;
    }
}
